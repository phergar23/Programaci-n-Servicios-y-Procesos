/* ============================================================
   Datos del curso
   ============================================================ */
const APP = {
  version: '1.3', fechaVersion: '2026-10-29', fechaVersionTxt: '29 de octubre de 2026',
  sello: '2026-08-26-psp-node-2dam · edición interactiva',
  bloques: {
    '0': { n: 'Bloque 0', t: 'Fundamentos de Node.js', d: 'El mismo JavaScript en otro escenario: event loop, módulos (CommonJS y ESM), npm como ecosistema, E/S con los módulos core y async/await a fondo. Cinco sesiones antes de tocar Express.' },
    '1': { n: 'Bloque 1', t: 'Filosofía y arquitectura de Express', d: 'Por qué un framework, de http.createServer a Express, anatomía de un proyecto, REST como forma de pensar una API y middleware como idea central. Seis sesiones.' },
    '2': { n: 'Bloque 2', t: 'Rutas, middleware y peticiones HTTP', d: 'Router modular, parámetros y body, middleware propio y su orden, manejo de errores centralizado, validación de entrada, CORS y subida de archivos. Siete sesiones.' },
    '3': { n: 'Bloque 3', t: 'Persistencia SQL con ORM', d: 'Por qué una base de datos y por qué un ORM, Sequelize de la conexión al CRUD, relaciones 1:N y N:M, y transacciones. Siete sesiones.' },
    '4': { n: 'Bloque 4', t: 'Persistencia NoSQL con ODM', d: 'MongoDB y Mongoose: esquemas, CRUD, referencias frente a documentos embebidos, agregaciones básicas y cuándo elegir SQL o NoSQL. Seis sesiones.' },
    '5': { n: 'Bloque 5', t: 'Autenticación y seguridad', d: 'Hashing de contraseñas con bcrypt, JWT, middleware de autenticación, roles y autorización, y buenas prácticas de seguridad básicas. Seis sesiones.' },
    '6': { n: 'Bloque 6', t: 'Arquitectura en capas, testing y documentación', d: 'Separar rutas, controladores, servicios y repositorios; logging; testing con Jest y Supertest; documentar con OpenAPI; configuración multientorno. Seis sesiones.' },
    '7': { n: 'Bloque 7', t: 'Despliegue profesional', d: 'Preparar la app para producción, Docker y docker-compose con base de datos, despliegue en la nube, dominios y HTTPS. Cinco sesiones.' },
    '8': { n: 'Bloque 8', t: 'Proyecto final full-stack', d: 'Diseño del contrato de API coordinado con el módulo de Front, backend completo del proyecto, conexión con Angular y despliegue conjunto antes de la FCT. Seis sesiones.' }
  },
  sesiones: [], conceptos: [], porId: {}, refId: {},
  estado: null
};

/* Fichas de la Referencia que desarrollan la teoría de cada sesión */
/* Cada sesión trae en su cabecera los ids de las fichas de Referencia que usa */
function fichasDeSesion(s) { return (s.conceptos || []).filter(f => APP.refId[f]); }
function sesionesDeFicha(fid) { return APP.sesiones.filter(s => s.conceptos.includes(fid)).map(s => s.id); }
/* Las sesiones se llaman S01…S64; su número visible («1.1») va al principio del título */
function numS(s) { if (typeof s === 'string') s = APP.porId[s]; return s ? s.id : ''; }
function titS(s) { if (typeof s === 'string') s = APP.porId[s]; return s ? String(s.titulo) : ''; }

/* ---------- Parseo (formato del curso original) ---------- */
function troceaBloques(txt, marca) {
  const lineas = txt.split('\n');
  const res = [];
  let act = null, cuerpo = null;
  const esMarca = l => /^@[SGQEPVZK](\s|$)/.test(l);
  for (const l of lineas) {
    if (!esMarca(l)) { if (cuerpo) cuerpo.push(l); continue; }
    const tipo = l[1];
    const resto = l.slice(2).trim();
    const r = { tipo, cab: resto, cuerpo: [] };
    if (act) act.partes.push(r);
    if (tipo === marca) { act = { cab: resto, partes: [] }; res.push(act); cuerpo = null; continue; }
    cuerpo = r.cuerpo;
  }
  return res;
}
/* Las comprobaciones @V se separan por |. Algunos patrones llevan | dentro
   (alternativas de una expresión regular): se reconstruyen por el número de campos de cada tipo. */
function leeCheck(cab) {
  const p = cab.split('|'), t = p[0];
  const n = { 'incluye': 4, 'no-incluye': 4, 'cuenta-min': 5, 'orden': 5, 'novacio': 2 }[t];
  if (!n || p.length <= n) return p;
  if (t === 'cuenta-min') { const k = p.findIndex((x, i) => i >= 2 && /^\d+$/.test(x)); if (k > 1) return [t, p.slice(1, k).join('|'), ...p.slice(k)]; }
  if (t === 'incluye' || t === 'no-incluye') return [t, p.slice(1, p.length - 2).join('|'), ...p.slice(-2)];
  return p;
}
function parseaSesiones(txt) {
  return troceaBloques(txt, 'S').map(b => {
    const [id, bloque, titulo, objetivo, conceptos] = b.cab.split('|');
    const s = { id, bloque, titulo, objetivo, conceptos: (conceptos || '').split(',').map(x => x.trim()).filter(Boolean), guion: '', diag: null, ejercicios: [], auto: [] };
    let ejAct = null;
    for (const p of b.partes) {
      if (p.tipo === 'G') { s.guion = p.cuerpo.join('\n').trim(); ejAct = null; }
      else if (p.tipo === 'Q') { const q = leePregunta(p); if (q.clase === 'd') s.diag = q; else s.auto.push(q); ejAct = null; }
      else if (p.tipo === 'E') {
        const [carril, tit, entrega] = p.cab.split('|');
        ejAct = { carril, titulo: tit, entrega: entrega === '1', enunciado: p.cuerpo.join('\n').trim(), pistas: [], checks: [], solucion: '' };
        s.ejercicios.push(ejAct);
      }
      else if (p.tipo === 'P' && ejAct) ejAct.pistas.push(p.cab);
      else if (p.tipo === 'V' && ejAct) ejAct.checks.push(leeCheck(p.cab));
      else if (p.tipo === 'Z' && ejAct) ejAct.solucion = p.cuerpo.join('\n').trim();
    }
    return s;
  });
}
function leePregunta(p) {
  const [clase, ...resto] = p.cab.split('|');
  const q = { clase, enunciado: resto.join('|'), opciones: [], buena: 0, explic: '' };
  let enExplic = false;
  for (const l of p.cuerpo) {

function quitaComentarios(js) {

function verifica(codigo, checks) {
  const limpio = quitaComentarios(codigo || '');

  function r(ok, titulo, detalle) { return { e: ok ? 'si' : 'no', titulo, detalle }; }
  function d(titulo, detalle) { return { e: 'duda', titulo, detalle }; }
  function cta(patron) {
    try { return (limpio.match(new RegExp(patron, 'gi')) || []).length; }
    catch (e) { return -1; }
  }
  function pos(patron) {
    try { const m = new RegExp(patron, 'i').exec(limpio); return m ? m.index : -1; }
    catch (e) { return -2; }
  }

  for (const c of checks) {
    const t = c[0];
    if (t === 'incluye') {
      const n = cta(c[1]);
      if (n === -1) { res.push(r(false, c[3] || c[1], 'Patrón no válido')); continue; }
      res.push(r(n > 0, c[3] || ('Aparece `' + c[1] + '`'), n > 0 ? '' : (c[2] || 'No se encuentra en tu código')));
    }
    else if (t === 'no-incluye') {
      const n = cta(c[1]);
      if (n === -1) { res.push(r(false, c[3] || c[1], 'Patrón no válido')); continue; }
      res.push(r(n === 0, c[3] || ('No aparece `' + c[1] + '`'), n === 0 ? '' : (c[2] || 'Aparece ' + n + ' vez/veces y no debería')));
    }
    else if (t === 'cuenta-min') {
      const n = cta(c[1]);
      const min = +c[2];
      if (n === -1) { res.push(r(false, c[4] || c[1], 'Patrón no válido')); continue; }
      res.push(r(n >= min, c[4] || ('Al menos ' + min + ' vez/veces `' + c[1] + '`'),
        n >= min ? '' : ((c[3] || 'Encontrado') + ': ' + n + ', se esperaban al menos ' + min)));
    }
    else if (t === 'orden') {
      const ia = pos(c[1]), ib = pos(c[2]);
      if (ia === -2 || ib === -2) { res.push(r(false, c[4] || 'Orden', 'Patrón no válido')); continue; }

/* ============================================================
   SHA-256, HMAC y Base64URL síncronos (para firmar JWT HS256 de verdad)
   ============================================================ */
const CRIPTO = (() => {
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  const ror = (x, n) => (x >>> n) | (x << (32 - n));
  const utf8 = s => new TextEncoder().encode(s);
  function sha256(msg) {
    const H = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
    const l = msg.length, nb = ((l + 9 + 63) >> 6) << 6, b = new Uint8Array(nb); b.set(msg); b[l] = 0x80;
    const dv = new DataView(b.buffer); dv.setUint32(nb - 4, (l * 8) >>> 0); dv.setUint32(nb - 8, Math.floor(l * 8 / 4294967296));
    const W = new Uint32Array(64);
    for (let i = 0; i < nb; i += 64) {
      for (let t = 0; t < 16; t++) W[t] = dv.getUint32(i + t * 4);
      for (let t = 16; t < 64; t++) { const x = W[t - 15], y = W[t - 2]; W[t] = W[t - 16] + (ror(x, 7) ^ ror(x, 18) ^ (x >>> 3)) + W[t - 7] + (ror(y, 17) ^ ror(y, 19) ^ (y >>> 10)); }
      let a = H[0], c1 = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], hh = H[7];
      for (let t = 0; t < 64; t++) {
        const t1 = (hh + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & g)) + K[t] + W[t]) >>> 0;
        const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & c1) ^ (a & c) ^ (c1 & c))) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = c1; c1 = a; a = (t1 + t2) >>> 0;
      }
      H[0] += a; H[1] += c1; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += hh;
    }
    const out = new Uint8Array(32), ov = new DataView(out.buffer); H.forEach((x, i) => ov.setUint32(i * 4, x)); return out;
  }
  function hmac(key, msg) {
    let k = typeof key === 'string' ? utf8(key) : key; if (k.length > 64) k = sha256(k);
    const kp = new Uint8Array(64); kp.set(k);
    const m = typeof msg === 'string' ? utf8(msg) : msg;
    const ip = new Uint8Array(64 + m.length), op = new Uint8Array(64 + 32);
    for (let i = 0; i < 64; i++) { ip[i] = kp[i] ^ 0x36; op[i] = kp[i] ^ 0x5c; }
    ip.set(m, 64); op.set(sha256(ip), 64); return sha256(op);
  }
  const hex = u => [...u].map(x => x.toString(16).padStart(2, '0')).join('');
  const b64url = u => { let s = ''; u.forEach(x => { s += String.fromCharCode(x); }); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const b64urlTxt = s => b64url(utf8(s));
  const desB64url = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))); };
  return { sha256: s => hex(sha256(utf8(s))), hmac, hex, b64url, b64urlTxt, desB64url };

/* jsonwebtoken, en miniatura: sign y verify con HS256 y los mismos errores */
const JWT = {
  sign(payload, secreto, segundos, ahora) {
    const iat = ahora, p = { ...payload, iat, exp: iat + segundos };
    const cab = CRIPTO.b64urlTxt(JSON.stringify({ alg: 'HS256', typ: 'JWT' })), cu = CRIPTO.b64urlTxt(JSON.stringify(p));
    return cab + '.' + cu + '.' + CRIPTO.b64url(CRIPTO.hmac(secreto, cab + '.' + cu));
  },
  decode(t) { try { const [a, b] = t.split('.'); return { header: JSON.parse(CRIPTO.desB64url(a)), payload: JSON.parse(CRIPTO.desB64url(b)) }; } catch (e) { return null; } },
  verify(t, secreto, ahora) {
    const E = (name, message, extra) => Object.assign(new Error(message), { name }, extra || {});
    if (!t) throw E('JsonWebTokenError', 'jwt must be provided');
    const ps = t.split('.');
    if (ps.length !== 3) throw E('JsonWebTokenError', 'jwt malformed');
    const d = JWT.decode(t); if (!d) throw E('JsonWebTokenError', 'invalid token');
    if (!ps[2]) throw E('JsonWebTokenError', 'jwt signature is required');
    if (CRIPTO.b64url(CRIPTO.hmac(secreto, ps[0] + '.' + ps[1])) !== ps[2]) throw E('JsonWebTokenError', 'invalid signature');
    if (typeof d.payload.exp === 'number' && ahora >= d.payload.exp) throw E('TokenExpiredError', 'jwt expired', { expiredAt: new Date(d.payload.exp * 1000) });
    return d.payload;
  }
};

/* Pinta una respuesta HTTP como la enseñaría Postman */
function httpRespuesta(r) {
  if (!r) return '<div class="muted" style="font-size:13.5px">Envía una petición.</div>';
  if (r.cuelga) return `<div class="http-st wait"><span class="spin-s"></span> Esperando respuesta… <small>${r.t ? r.t + ' s' : ''}</small></div><div class="muted" style="font-size:13px;margin-top:6px">El cliente se queda esperando hasta que salte su tiempo de espera.</div>`;
  const cls = r.st < 300 ? 'ok' : r.st < 500 ? 'warn' : 'bad';
  const txt = { 200: 'OK', 201: 'Created', 204: 'No Content', 400: 'Bad Request', 401: 'Unauthorized', 403: 'Forbidden', 404: 'Not Found', 409: 'Conflict', 413: 'Payload Too Large', 415: 'Unsupported Media Type', 429: 'Too Many Requests', 500: 'Internal Server Error' }[r.st] || '';
  const cuerpo = r.body === undefined ? '' : typeof r.body === 'string' ? `<pre class="http-b">${esc(r.body)}</pre>` : `<pre class="http-b">${HL.hl(JSON.stringify(r.body, null, 2), 'json')}</pre>`;
  return `<div class="http-st ${cls}"><b>${r.st} ${txt}</b><small>${r.ms || 3} ms</small></div>${r.h ? `<div class="http-h">${Object.entries(r.h).map(([k, v]) => `<div><span>${esc(k)}:</span> ${esc(v)}</div>`).join('')}</div>` : ''}${cuerpo}`;
}

    const m = msgRow(card);
    function lineas() {
      const T = modo === 0 ? '' : ', { transaction: t }', T2 = modo === 0 ? '' : ', transaction: t';
      const L = [];
      if (modo === 2) {
        L.push(['ts', 'await sequelize.transaction(async (t) => {', 'b'], ['ts', '  const pedido = await Pedido.create(datosPedido, { transaction: t });', 'c'], ['ts', '  for (const linea of lineas) {', 'f'], ['ts', '    const producto = await Producto.findByPk(linea.id, { transaction: t });', 'f'], ['ts', '    await pedido.addProducto(producto, { through: { cantidad: linea.cantidad }, transaction: t });', 'a'], ['ts', '  }'], ['ts', '  return pedido;   // sin error → commit automático', 'k'], ['ts', '});               // si algo lanza → rollback automático', 'r']);
        return L;
      }
      L.push(['ts', 'async function crearPedidoConLineas(datosPedido, lineas) {']);
      if (modo) L.push(['ts', '  const t = await sequelize.transaction();', 'b'], ['ts', '  try {']);
      const s = modo ? '    ' : '  ';
      L.push(['ts', `${s}const pedido = await Pedido.create(datosPedido${modo === 3 ? '' : T});${modo === 3 ? '   // ← falta { transaction: t }' : ''}`, 'c'], ['ts', `${s}for (const linea of lineas) {`, 'f'], ['ts', `${s}  const producto = await Producto.findByPk(linea.id${T});`, 'f'], ['ts', `${s}  await pedido.addProducto(producto, { through: { cantidad: linea.cantidad }${T2} });`, 'a'], ['ts', `${s}}`]);
      if (modo) L.push(['ts', '    await t.commit();', 'k'], ['ts', '    return pedido;'], ['ts', '  } catch (error) {', 'r'], ['ts', '    await t.rollback();', 'r'], ['ts', '    throw error;', 'r'], ['ts', '  }']);
      else L.push(['ts', '  return pedido;', 'k']);
      L.push(['ts', '}']);
      return L;
    }
    function prepara() {
      clearTimeout(timer); i = 0; pasos = []; term.clear('-- pulsa Ejecutar o Paso'); code.set(lineas());
      D.ped.forEach(r => { if (r.st === 'new') r.st = ''; }); D.pp.forEach(r => { if (r.st === 'new') r.st = ''; });
      D.ped = D.ped.filter(r => r.st !== 'rb'); D.pp = D.pp.filter(r => r.st !== 'rb');
      const id = Math.max(0, ...D.ped.map(r => r.id)) + 1;
      const tx = modo ? Math.random().toString(16).slice(2, 10) + '-3c73-46bb-ad1e-962b4ba307f5' : 'default';
      const enTx = modo !== 0;
      if (enTx) pasos.push({ tag: 'b', sql: 'BEGIN DEFERRED TRANSACTION;', tx });

        if (falla === k + 1) pasos.push({ tag: 'a', err: true });

      });

      else {

      }

    }
    function pinta() {
      const mk = rs => Object.fromEntries(rs.filter(r => r.st).map(r => [r._k || r.id, { cls: r.st }]));

    }

    function ejecuta() {

      const hit = l => l.forEach(d => { marks[d._id] = 'hit'; });
      if (o === 0) { hit(docs); res(docs); m('<code>find()</code> sin filtro devuelve un <b>array</b> con todos los documentos. Cada uno trae su <code>_id</code> (un ObjectId) y <code>__v</code>, la versión interna que añade Mongoose.', 'info'); }

        const d = docs.find(x => x._id === sel);

        else { const antes = { ...d }; d.precio = 22; marks[d._id] = 'upd'; res(nuevo ? d : antes); m(nuevo ? 'Con <code>{ new: true }</code> devuelve el documento <b>ya actualizado</b>.' : `En la colección el precio ya es 22, pero lo que devuelve es el documento <b>de antes</b> (${antes.precio === 22 ? 'que ya valía 22: prueba con otro documento' : 'precio ' + antes.precio}). Es el comportamiento por defecto y sorprende a quien viene de Sequelize: añade <code>{ new: true }</code>.`, nuevo ? 'good' : 'warn'); }

        else { marks[d._id] = 'del'; res(d); pintaCol(); after(900, () => { docs = docs.filter(x => x !== d); sel = docs[0] && docs[0]._id; pintaCol(); }); m('<code>findByIdAndDelete</code> borra y devuelve el documento borrado (o <code>null</code> si no existía).', 'good'); return; }
      }
      pintaCol();
    }
    params(); ejecuta();
  }
});

    const DOCS = PROD_M.map((p, i) => ({ _id: OID(i + 1), nombre: p[0], precio: p[1], categoria: p[2] }));
    const ST = {
      match: { on: false, t: () => `{ $match: { precio: { $gte: ${ST.match.v} } } }`, v: 20 },
      group: { on: true, t: () => `{ $group: { _id: '$categoria', totalProductos: { $sum: 1 }, precioMedio: { $avg: '$precio' }${ST.group.max ? ", precioMax: { $max: '$precio' }" : ''} } }`, max: false },
      sort: { on: true, t: () => `{ $sort: { precioMedio: -1 } }` },
      project: { on: false, t: () => "{ $project: { _id: 0, categoria: '$_id', totalProductos: 1, precioMedio: { $round: ['$precioMedio', 2] } } }" },
      limit: { on: false, t: () => '{ $limit: 2 }' }
    };
    let orden = ['match', 'group', 'sort', 'project', 'limit'];
    const r0 = row(card);
    rangeCtl(r0, { label: '$match: precio ≥', min: 0, max: 200, step: 10, value: ST.match.v, onInput: v => { ST.match.v = v; pinta(); } });
    toggle(r0, 'Añadir <code>precioMax</code> al $group', false, v => { ST.group.max = v; pinta(); });
    btn(r0, icon('reset') + 'Como en el apunte', () => { orden = ['match', 'group', 'sort', 'project', 'limit']; Object.values(ST).forEach(s => s.on = false); ST.group.on = ST.sort.on = true; pinta(); }, 'ghost sm');
    const lista = h('div', { class: 'ag-list' }); card.appendChild(lista);
    const cc = cols(card, 'w21');
    const pC = pane(cc, 'El código', { dark: true, fn: 'productos.service.js' }); const code = h('pre', { class: 'orm-js' }); pC.body.appendChild(code);
    const pR = pane(cc, 'Resultado final'); const out = h('div'); pR.body.appendChild(out);
    const flujo = h('div', { class: 'ag-flow' }); card.appendChild(flujo);
    const m = msgRow(card);
    const r2 = n => Math.round(n * 100) / 100;
    function aplica(k, ds) {
      if (k === 'match') return ds.filter(d => typeof d.precio === 'number' && d.precio >= ST.match.v);
      if (k === 'group') { const g = new Map(); ds.forEach(d => { const key = d.categoria === undefined ? null : d.categoria; if (!g.has(key)) g.set(key, []); g.get(key).push(d); }); return [...g.entries()].map(([key, l]) => { const ns = l.map(d => d.precio).filter(x => typeof x === 'number'); const o = { _id: key, totalProductos: l.length, precioMedio: ns.length ? ns.reduce((a, b) => a + b, 0) / ns.length : null }; if (ST.group.max) o.precioMax = ns.length ? Math.max(...ns) : null; return o; }); }
      if (k === 'sort') return ds.slice().sort((a, b) => { const x = a.precioMedio, y = b.precioMedio; if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return y - x; });
      if (k === 'project') return ds.map(d => { const o = { categoria: d._id }; if (d.totalProductos !== undefined) o.totalProductos = d.totalProductos; o.precioMedio = typeof d.precioMedio === 'number' ? r2(d.precioMedio) : null; return o; });
      if (k === 'limit') return ds.slice(0, 2);
      return ds;
    }
    function mini(d) { return `<div class="ag-doc">${Object.entries(d).filter(([k]) => k !== '_id' || typeof d._id !== 'string' || !/^[0-9a-f]{24}$/.test(d._id)).map(([k, v]) => `<span><i>${esc(k)}</i> ${esc(typeof v === 'number' ? String(r2(v)) : v === null ? 'null' : String(v))}</span>`).join('')}</div>`; }
    function pinta() {
      lista.innerHTML = orden.map((k, i) => `<div class="ag-it ${ST[k].on ? 'on' : ''}"><label class="sw"><input type="checkbox" role="switch" data-on="${k}" ${ST[k].on ? 'checked' : ''}><span></span></label><code>${esc(ST[k].t())}</code><span class="mw-mv"><button type="button" data-up="${i}" aria-label="Subir" ${i === 0 ? 'disabled' : ''}>▲</button><button type="button" data-dn="${i}" aria-label="Bajar" ${i === orden.length - 1 ? 'disabled' : ''}>▼</button></span></div>`).join('');
      $$('[data-on]', lista).forEach(x => x.onchange = () => { ST[x.dataset.on].on = x.checked; pinta(); });
      $$('[data-up]', lista).forEach(b => b.onclick = () => { const i = +b.dataset.up; [orden[i - 1], orden[i]] = [orden[i], orden[i - 1]]; pinta(); });
      $$('[data-dn]', lista).forEach(b => b.onclick = () => { const i = +b.dataset.dn; [orden[i + 1], orden[i]] = [orden[i], orden[i + 1]]; pinta(); });
      const act = orden.filter(k => ST[k].on);
      code.innerHTML = HL.hl(`const resultado = await Producto.aggregate([\n${act.map(k => '  ' + ST[k].t()).join(',\n')}\n]);`, 'ts');
      let ds = DOCS; const etapas = [['productos', ds]];
      act.forEach(k => { ds = aplica(k, ds); etapas.push(['$' + k, ds]); });
      flujo.innerHTML = etapas.map(([n, l], i) => `${i ? '<div class="ag-ar">→</div>' : ''}<div class="ag-st"><div class="ag-sh"><b>${esc(n)}</b><small>${l.length} doc${l.length === 1 ? '' : 's'}</small></div><div class="ag-sb">${l.map(mini).join('') || '<div class="muted" style="font-size:12px">vacío</div>'}</div></div>`).join('');
      out.innerHTML = `<pre class="http-b tall" style="margin:0">${HL.hl(jsonCompacto(ds.map(d => { const o = {}; for (const k in d) o[k] = typeof d[k] === 'number' && k !== 'totalProductos' && k !== 'precio' ? r2(d[k]) : d[k]; return o; })), 'json')}</pre>`;
      const pos = k => act.indexOf(k);
      if (!act.length) return m('Sin etapas, <code>aggregate([])</code> devuelve la colección tal cual.', 'info');
      if (ST.match.on && ST.group.on && pos('match') > pos('group')) return m('<code>$match</code> va <b>después</b> de <code>$group</code>: los documentos que le llegan ya no son productos sino grupos, y no tienen campo <code>precio</code>. No pasa ninguno. Filtra antes de agrupar.', 'bad');
      if (ST.sort.on && ST.group.on && pos('sort') < pos('group')) return m('<code>$sort</code> por <code>precioMedio</code> antes de agrupar no hace nada útil: los productos no tienen ese campo. Cada etapa trabaja sobre lo que le entrega la anterior.', 'warn');
      if (ST.sort.on && !ST.group.on) return m('Sin <code>$group</code> no existe <code>precioMedio</code>: el <code>$sort</code> no tiene por dónde ordenar.', 'warn');
      if (ST.limit.on && ST.sort.on && pos('limit') < pos('sort')) return m('<code>$limit</code> antes de <code>$sort</code>: se queda con los 2 primeros grupos <b>en el orden en que salen</b> y luego los ordena. Para «las 2 categorías más caras», primero ordena y luego limita.', 'warn');
      if (ST.project.on && ST.group.on && pos('project') < pos('group')) return m('<code>$project</code> antes de <code>$group</code>: transforma productos, no grupos, y se pierden <code>precio</code> y <code>categoria</code>. Todo acaba en un único grupo <code>null</code>.', 'bad');
      if (ST.group.on) return m(`<code>$group</code> convierte ${ST.match.on ? 'los productos filtrados' : 'los 12 productos'} en <b>un documento por categoría</b>: <code>_id</code> es el valor por el que se agrupa y <code>$sum: 1</code> cuenta. Es un cálculo sobre el conjunto que <code>find()</code> no puede hacer.`, 'good');
      m('Cada etapa recibe los documentos de la anterior y entrega los suyos a la siguiente.', 'info');
    }
    pinta();
  }
});

/* ============================================================

   (bcrypt real con bcryptjs; JWT HS256 real, idéntico a jsonwebtoken)

/* ---------- Contraseñas: texto plano, hash sin sal y bcrypt ---------- */
lab('bcrypt', {
  title: 'Guardar contraseñas: texto plano, hash y bcrypt', block: '5', glyph: '$2b$10$…', col: '#FF9A5A',
  desc: 'Registra usuarios con la misma contraseña y compara cómo quedan en la tabla según se guarden en texto plano, con un hash sin sal o con bcrypt (calculado de verdad en tu navegador). Sube el coste y mide el tiempo; luego «roba» la base de datos y mira qué puede sacar un atacante.',
  where: [{ s: '5.1', after: 'Usar bcrypt en la práctica' }],
  fichas: [{ f: 'hashing-contrasenas' }, { f: 'bcrypt-uso', opt: { modo: 2 } }],
  mount(host, opt = {}) {
    const card = simCard(host, { id: 'bcrypt', title: 'Guardar contraseñas', hint: 'bcrypt real (bcryptjs) · SHA-256 real' });
    const COMUNES = ['123456', 'password', '123456789', '12345678', 'qwerty', 'abc123', 'patata123', 'contraseña', 'iloveyou', '111111', 'admin', 'futbol', 'hola1234', 'barcelona', 'madrid2024'];
    let modo = opt.modo === undefined ? 2 : opt.modo, coste = 10, users = [], ocupado = false, vivo = true, ultMs = 0;
    onCleanup(() => { vivo = false; });
    const r0 = row(card);
    seg(r0, [{ label: 'Texto plano' }, { label: 'SHA-256 sin sal' }, { label: 'bcrypt' }], (it, i) => { modo = i; users = []; pinta(); expl(); }, modo, 'Cómo se guarda');
    const rc = rangeCtl(r0, { label: 'Coste de bcrypt', min: 4, max: 14, value: coste, fmt: v => `${v} → 2^${v} = ${(2 ** v).toLocaleString('es-ES')} rondas`, onInput: v => { coste = v; } });
    const r1 = row(card);
    const email = h('input', { class: 'inp', value: 'ana@correo.es', 'aria-label': 'Email', style: { width: '190px' } });
    const pass = h('input', { class: 'inp', value: 'patata123', 'aria-label': 'Contraseña', style: { width: '150px', fontFamily: 'var(--f-mono)' } });
    const g1 = grp(r1, 'Registro'); g1.append(email, pass);
    const bReg = btn(r1, icon('upload') + 'Registrar', () => registra(), 'sm');
    btn(r1, icon('reset') + 'Vaciar tabla', () => { users = []; pinta(); expl(); }, 'ghost sm');
    const r2 = row(card);
    const lpass = h('input', { class: 'inp', value: 'patata123', 'aria-label': 'Contraseña para iniciar sesión', style: { width: '150px', fontFamily: 'var(--f-mono)' } });
    const g2 = grp(r2, 'Login de ana@correo.es'); g2.append(lpass);
    const bLog = btn(r2, icon('check') + 'Iniciar sesión', () => login(), 'ghost sm');
    const bRobo = btn(r2, icon('warn') + 'Robar la base de datos', () => robo(), 'ghost sm');
    const cc = cols(card, 'w21');
    const izq = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px', minWidth: 0 } }); cc.appendChild(izq);
    const pC = pane(izq, 'El código', { dark: true, fn: 'auth.service.js' }); const code = h('pre', { class: 'orm-js' }); pC.body.appendChild(code);
    const tab = dbTabla(izq, 'Usuarios');
    const anat = h('div', { class: 'bc-anat' }); izq.appendChild(anat);
    const pR = pane(cc, 'Resultado', { fn: 'en tu navegador' }); const out = h('div', { class: 'bc-out' }); pR.body.appendChild(out);
    const m = msgRow(card);
    function pintaCod() {
      code.innerHTML = HL.hl([
        "async function registrar(email, contrasena) {",
        modo === 0 ? "  await Usuario.create({ email, contrasena });   // tal cual" : modo === 1 ? "  const hash = crypto.createHash('sha256').update(contrasena).digest('hex');\n  await Usuario.create({ email, contrasena: hash });" : `  const hash = await bcrypt.hash(contrasena, ${coste});\n  await Usuario.create({ email, contrasena: hash });`,
        '}', '',
        'async function iniciarSesion(email, contrasenaIntroducida) {',
        '  const usuario = await Usuario.findOne({ where: { email } });',
        '  if (!usuario) return null;',
        modo === 0 ? '  const coincide = contrasenaIntroducida === usuario.contrasena;' : modo === 1 ? "  const coincide = sha256(contrasenaIntroducida) === usuario.contrasena;" : '  const coincide = await bcrypt.compare(contrasenaIntroducida, usuario.contrasena);',
        '  return coincide ? usuario : null;', '}'].join('\n'), 'ts');
    }
    function pinta(marks = {}) {
      pintaCod();
      tab.set(['id', 'email', 'contrasena'], users.map(u => ({ id: u.id, email: u.email, contrasena: u.guardado })), marks);
      const u = users.filter(x => x.modo === 2).slice(-1)[0];
      if (modo === 2 && u) { const s = u.guardado; anat.innerHTML = `<div class="bc-h"><span class="a">${s.slice(0, 4)}</span><span class="b">${s.slice(4, 7)}</span><span class="c">${s.slice(7, 29)}</span><span class="d">${s.slice(29)}</span></div><div class="bc-l"><span class="a">algoritmo</span><span class="b">coste ${s.slice(4, 6)}</span><span class="c">sal (22 caracteres)</span><span class="d">hash (31 caracteres)</span></div>`; anat.hidden = false; }
      else anat.hidden = true;
    }
    function expl() {
      m(['<b>Texto plano</b>: la columna guarda la contraseña tal cual. Cualquiera con acceso a la tabla (un empleado, una copia de seguridad, un atacante) la ve.', '<b>SHA-256</b> es de un solo sentido, pero <b>sin sal</b>: la misma contraseña produce siempre el mismo hash. Registra dos usuarios con la misma contraseña y compáralos.', '<b>bcrypt</b> añade una <b>sal aleatoria</b> a cada hash y es lento a propósito. Registra dos veces la misma contraseña: los hashes no se parecen en nada.'][modo], 'info');
    }
    async function registra() {
      if (ocupado) return; const e = email.value.trim() || 'usuario@correo.es', p = pass.value;
      const id = users.length + 1; let guardado;
      if (modo === 0) guardado = p;
      else if (modo === 1) guardado = CRIPTO.sha256(p);
      else {
        ocupado = true; bReg.disabled = bLog.disabled = true; out.innerHTML = `<div class="http-st wait"><span class="spin-s"></span> bcrypt.hash(…, ${coste}) calculando…</div>`;
        const t0 = performance.now(); guardado = await bcrypt.hash(p, coste); ultMs = performance.now() - t0;
        if (!vivo) return; ocupado = false; bReg.disabled = bLog.disabled = false;
      }
      users.push({ id, email: e, guardado, modo, plano: p });
      const iguales = users.filter(u => u.plano === p && u.modo === modo).length > 1;
      pinta({ [id]: { cls: 'new' } });
      out.innerHTML = modo === 2 ? `<div class="bc-t"><b>${Math.round(ultMs)} ms</b><span>para un hash con coste ${coste}</span></div><div class="muted" style="font-size:13px">Cada punto de coste <b>duplica</b> el tiempo. Al servidor le cuesta ${Math.round(ultMs)} ms una vez por login; a un atacante le cuesta eso <b>por cada contraseña que prueba</b>.</div>` : `<pre class="http-b" style="margin:0">${esc(guardado)}</pre>`;
      if (modo === 1 && iguales) m('Dos usuarios con la misma contraseña tienen <b>exactamente el mismo hash</b>: quien descubra una, sabe la otra. Y un atacante puede precalcular los hashes de millones de contraseñas comunes y buscarlos directamente.', 'bad');
      else if (modo === 2 && iguales) m('Misma contraseña, <b>hashes distintos</b>: cada uno lleva su propia sal (los 22 caracteres tras el coste). Por eso no se comparan hashes con <code>===</code>, sino con <code>bcrypt.compare</code>, que lee la sal del hash guardado.', 'good');
      else expl();
    }
    async function login() {
      const u = users.filter(x => x.email === 'ana@correo.es').slice(-1)[0];
      if (!u) return m('Primero registra a <code>ana@correo.es</code>.', 'warn');
      if (ocupado) return;
      let ok, ms = 0;
      if (u.modo === 0) ok = lpass.value === u.guardado;
      else if (u.modo === 1) ok = CRIPTO.sha256(lpass.value) === u.guardado;
      else { ocupado = true; const t0 = performance.now(); ok = await bcrypt.compare(lpass.value, u.guardado); ms = performance.now() - t0; ocupado = false; if (!vivo) return; }
      pinta({ [u.id]: { cls: ok ? 'hit' : 'del' } });
      out.innerHTML = httpRespuesta(ok ? { st: 200, body: { mensaje: 'Sesión iniciada' } } : { st: 401, body: { error: 'Credenciales incorrectas' } }) + (u.modo === 2 ? `<div class="muted" style="font-size:13px;margin-top:8px">bcrypt.compare: ${Math.round(ms)} ms. No «descifra» nada: vuelve a calcular el hash con la sal guardada y compara.</div>` : '');
      m(ok ? 'Coincide: la contraseña introducida produce el mismo resultado que el guardado.' : 'No coincide: <b>401</b>. El mensaje no dice si falló el email o la contraseña, para no dar pistas.', ok ? 'good' : 'warn');
    }
    async function robo() {
      if (!users.length) return m('La tabla está vacía: registra algún usuario primero.', 'warn');
      if (ocupado) return;
      const dic = {}; COMUNES.forEach(c => { dic[CRIPTO.sha256(c)] = c; });
      const res = [];
      for (const u of users) {
        if (u.modo === 0) res.push([u.email, u.guardado, 'leída directamente']);
        else if (u.modo === 1) res.push([u.email, dic[u.guardado] || '—', dic[u.guardado] ? 'encontrada en la tabla precalculada' : 'no está entre las comunes']);
        else res.push([u.email, null, 'hay que probar una a una']);
      }
      let extra = '';
      const b = users.find(u => u.modo === 2);
      if (b) {
        ocupado = true; out.innerHTML = '<div class="http-st wait"><span class="spin-s"></span> Probando contraseñas comunes contra un hash bcrypt…</div>';
        const t0 = performance.now(); let hallada = null, n = 0;
        for (const c of COMUNES) { n++; if (await bcrypt.compare(c, b.guardado)) { hallada = c; break; } if (!vivo) return; }
        const ms = performance.now() - t0; ocupado = false;
        res.forEach(r => { if (r[1] === null) r[1] = hallada || '—'; });
        const porIntento = ms / n, rondas = b.guardado.slice(4, 6);
        extra = `<div class="muted" style="font-size:13px;margin-top:8px">${n} intentos contra bcrypt (coste ${rondas}) en ${Math.round(ms)} ms: <b>${Math.round(porIntento)} ms por intento</b>. Probar un diccionario de 10 millones de contraseñas llevaría unas <b>${fmtDur(porIntento * 1e7)}</b> en este navegador, y hay que repetirlo <b>por cada usuario</b> (cada uno tiene su sal).${hallada ? ' Aun así, <b>una contraseña muy común cae igual</b>: bcrypt frena, no hace milagros.' : ''}</div>`;
      }
      out.innerHTML = `<table class="tbl" style="width:100%;font-size:13px"><thead><tr><th>usuario</th><th>contraseña</th><th>cómo</th></tr></thead><tbody>${res.map(r => `<tr><td>${esc(r[0])}</td><td><code>${esc(r[1])}</code></td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table>` + extra;
      const peor = users.some(u => u.modo === 0) ? 0 : users.some(u => u.modo === 1) ? 1 : 2;
      m(['Con texto plano, robar la tabla es robar todas las contraseñas. Y muchos usuarios repiten contraseña en otros servicios.', 'SHA-256 es rapidísimo: un atacante precalcula los hashes de millones de contraseñas comunes y los <b>busca</b> en la tabla robada. Sin sal, además, uno sirve para todos los usuarios.', 'Con bcrypt no hay tabla precalculada que valga (cada hash tiene su sal) y cada intento cuesta tiempo real. Sube el coste y vuelve a probar.'][peor], ['bad', 'bad', 'good'][peor]);
    }
    function fmtDur(ms) { const s = ms / 1000; if (s < 120) return Math.round(s) + ' s'; const hh = s / 3600; if (hh < 48) return Math.round(hh) + ' horas'; const d = hh / 24; if (d < 730) return Math.round(d) + ' días'; return Math.round(d / 365) + ' años'; }
    void rc; pinta(); expl();
  }
});

  title: 'node, nodemon o PM2: qué pasa cuando algo falla', block: '7', glyph: 'pm2 list · ↺', col: '#52CF8F',
  desc: 'Peticiones llegando sin parar a tu API. Lanza un error no capturado o una tarea pesada y compara qué pasa con node, con nodemon, con PM2 en una instancia y con PM2 en modo cluster: quién se recupera solo y cuántas peticiones se pierden.',
  where: [{ s: '7.1', after: 'PM2: un gestor de procesos para Node en producción', opt: { modo: 2 } }, { s: '7.1', after: 'Un archivo de configuración para PM2', opt: { modo: 3 } }, { s: '1.2', after: 'nodemon: dejar de reiniciar el servidor a mano', opt: { modo: 1 } }],
  fichas: [{ f: 'pm2-gestor-procesos', opt: { modo: 3 } }, { f: 'nodemon-desarrollo', opt: { modo: 1 } }, { f: 'preparacion-produccion', opt: { modo: 0 } }],
  mount(host, opt = {}) {
    const card = simCard(host, { id: 'pm2', title: 'node, nodemon o PM2', hint: 'mi-api en un servidor con 4 núcleos' });
    const MODOS = ['node index.js', 'nodemon index.js', 'pm2 start index.js', 'pm2 start ecosystem.config.js'];
    let modo = opt.modo === undefined ? 2 : opt.modo, rate = 8, inst = [], rr = 0, acc = 0, hist = [], ok = 0, fal = 0, len = 0, pidSig = 4211, t = 0;
    const r0 = row(card);
    seg(r0, MODOS.map(x => ({ label: x })), (it, i) => { modo = i; arranca(); }, modo, 'Arranque');
    const r1 = row(card);
    rangeCtl(r1, { label: 'Tráfico', min: 1, max: 20, value: rate, fmt: v => `${v} pet/s`, onInput: v => { rate = v; } });
    btn(r1, icon('bug') + 'Error no capturado', () => peta(), 'sm');
    btn(r1, icon('warn') + 'Tarea pesada (CPU 3 s)', () => pesada(), 'ghost sm');
    const bFix = btn(r1, icon('pencil') + 'Guardar un archivo', () => guarda(), 'ghost sm');
    const bMan = btn(r1, icon('play') + 'Volver a lanzar node', () => arranca(true), 'ghost sm');
    const cc = cols(card, 'w21');
    const izq = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px', minWidth: 0 } }); cc.appendChild(izq);
    const insV = h('div', { class: 'pm-ins' }); izq.appendChild(insV);
    const strip = h('div', { class: 'rl-hist pm-strip' }); izq.appendChild(strip);
    const tabla = h('pre', { class: 'pm-list' }); izq.appendChild(tabla);
    const der = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px', minWidth: 0 } }); cc.appendChild(der);
    const stats = h('div', { class: 'pm-stats' }); der.appendChild(stats);
    const pL = pane(der, 'Terminal del servidor', { dark: true, fn: 'ssh' }); const term = terminal(pL.body, { max: 18 }); term.el.style.minHeight = '220px'; term.el.style.maxHeight = '300px';
    const m = msgRow(card);
    function nueva(i) { return { id: i, pid: pidSig += 17 + i * 3, st: 'online', rs: 0, sv: 0, busy: 0, up: t }; }
    function arranca(manual) {
      const n = modo === 3 ? 4 : 1; inst = []; for (let i = 0; i < n; i++) inst.push(nueva(i));
      if (!manual) { hist = []; ok = fal = len = 0; term.clear(''); }
      term.log(`$ ${MODOS[modo]}`, 'dim');
      if (modo === 1) { term.log('[nodemon] 3.1.10', 'warn'); term.log('[nodemon] watching path(s): *.*', 'warn'); term.log('[nodemon] starting `node index.js`', 'ok'); }
      if (modo >= 2) { term.log(`[PM2] Starting ${modo === 3 ? '/app/ecosystem.config.js' : '/app/index.js'} in ${modo === 3 ? 'cluster' : 'fork'}_mode (${n} instance${n > 1 ? 's' : ''})`, 'info'); inst.forEach(x => term.log(`PM2 log: App [mi-api:${x.id}] online`, 'dim')); }
      else term.log('Servidor escuchando en el puerto 3000');
      bFix.hidden = modo !== 1; bMan.hidden = modo !== 0;
      pinta();
      m(['Arrancada «a pelo»: si el proceso muere, nadie lo vuelve a levantar.', 'nodemon reinicia la app cuando <b>cambias un archivo</b>. Es para desarrollo: ¿qué hará si la app se cae sola?', 'PM2 vigila el proceso y lo <b>relanza automáticamente</b> si muere. Prueba el error no capturado.', '<code>instances: \'max\'</code> y <code>exec_mode: \'cluster\'</code>: una instancia por núcleo, y PM2 reparte las peticiones entre ellas.'][modo], 'info');
    }
    function peta() {
      const vivos = inst.filter(x => x.st === 'online'); if (!vivos.length) return;
      const x = vivos[rr % vivos.length]; x.st = 'errored';
      const pre = modo >= 2 ? `${x.id}|mi-api  | ` : '';
      term.log(`${pre}/app/src/routes/tareas.routes.js:18`, 'err'); term.log(`${pre}      throw new Error('La base de datos no responde');`, 'err'); term.log(`${pre}Error: La base de datos no responde`, 'err');
      if (modo === 0) { term.log('$ ', 'dim'); m('El proceso <b>ha muerto</b> y la terminal vuelve al prompt. Todas las peticiones fallan hasta que alguien entre al servidor y vuelva a lanzar <code>node index.js</code>… a las 3 de la mañana.', 'bad'); }
      else if (modo === 1) { term.log('[nodemon] app crashed - waiting for file changes before starting...', 'err'); m('nodemon <b>no</b> reinicia tras un fallo: se queda «esperando cambios en los archivos». Perfecto para programar (arreglas y guardas), inútil en producción.', 'bad'); }
      else {
        term.log(`PM2 log: App [mi-api:${x.id}] exited with code [1] via signal [SIGINT]`, 'warn');
        after(700, () => { x.st = 'launching'; term.log(`PM2 log: App [mi-api:${x.id}] starting in -${modo === 3 ? 'cluster' : 'fork'} mode-`, 'dim'); pinta(); after(500, () => { x.st = 'online'; x.rs++; x.pid = pidSig += 23; x.up = t; x.busy = 0; term.log(`PM2 log: App [mi-api:${x.id}] online`, 'ok'); pinta(); }); });
        m(modo === 3 ? 'PM2 relanza la instancia caída en un segundo y, mientras tanto, <b>las otras tres siguen atendiendo</b>. Apenas se pierde nada. Mira la columna <b>↺</b> de <code>pm2 list</code>.' : 'PM2 detecta la salida y <b>relanza</b> el proceso solo (columna <b>↺</b>). Durante ese segundo se pierden algunas peticiones: con una sola instancia no hay quien las atienda.', 'good');
      }
      pinta();
    }
    function pesada() {
      const vivos = inst.filter(x => x.st === 'online'); if (!vivos.length) return;
      const x = vivos[rr % vivos.length]; x.busy = t + 30;
      m(modo === 3 ? `La instancia ${x.id} tiene su event loop bloqueado 3 s: las peticiones que PM2 le reparte esperan, pero <b>las demás instancias siguen respondiendo</b> al momento.` : 'Una tarea síncrona pesada <b>bloquea el event loop</b> del único proceso (bloque 0): durante 3 s <b>todas</b> las peticiones se quedan esperando. Con varias instancias en cluster, solo le pasaría a una parte.', modo === 3 ? 'good' : 'warn');
    }
    function guarda() {
      if (modo !== 1) return; const x = inst[0];
      term.log('[nodemon] restarting due to changes...', 'warn'); term.log('[nodemon] starting `node index.js`', 'ok'); term.log('Servidor escuchando en el puerto 3000');
      x.st = 'online'; x.pid = pidSig += 31; x.up = t; x.busy = 0; pinta();
      m('Al guardar un archivo, nodemon reinicia la app. En desarrollo es justo lo que quieres; en producción nadie está guardando archivos para levantarla.', 'info');
    }
    function tick() {
      t++; acc += rate / 10;
      while (acc >= 1) {
        acc--;
        const vivos = inst.filter(x => x.st === 'online');
        if (!vivos.length) { hist.push('f'); fal++; continue; }
        const x = vivos[rr++ % vivos.length]; x.sv++;
        if (x.busy > t) { hist.push('l'); len++; } else { hist.push('o'); ok++; }
      }
      while (hist.length > 80) hist.shift();
      if (t % 2 === 0) pinta();
    }
    function pinta() {
      insV.innerHTML = inst.map(x => { const b = x.busy > t; return `<div class="pm-i ${x.st}${b ? ' busy' : ''}"><div class="pm-ih"><b>${modo >= 2 ? `mi-api:${x.id}` : modo === 1 ? 'nodemon → node' : 'node'}</b><span>${b ? 'bloqueada' : { online: 'online', errored: modo >= 2 ? 'errored' : 'caído', launching: 'launching' }[x.st]}</span></div><small>pid ${x.st === 'errored' ? '—' : x.pid} · ${x.sv} atendidas${modo >= 2 ? ` · ↺ ${x.rs}` : ''}</small><div class="pm-cpu"><i style="width:${x.st !== 'online' ? 0 : b ? 100 : Math.min(90, 6 + rate * 3 / inst.length + (t * 7 + x.id * 13) % 9)}%"></i></div></div>`; }).join('');
      strip.innerHTML = hist.map(k => `<span class="pm-r ${k}"></span>`).join('');
      const tot = ok + fal + len;
      stats.innerHTML = `<div><b>${ok}</b><small>respondidas</small></div><div class="l"><b>${len}</b><small>lentas (&gt; 1 s)</small></div><div class="f"><b>${fal}</b><small>perdidas</small></div><div><b>${tot ? Math.round(ok / tot * 100) : 100}%</b><small>disponibilidad</small></div>`;
      if (modo >= 2) {
        const up = x => { const s = Math.max(0, Math.floor((t - x.up) / 10)); return s < 60 ? s + 's' : Math.floor(s / 60) + 'm'; };
        const L = [['id', 3], ['name', 8], ['mode', 8], ['pid', 6], ['uptime', 7], ['↺', 4], ['status', 10], ['cpu', 5]];
        const fila = vals => '│ ' + vals.map((v, i) => String(v).padEnd(L[i][1])).join(' │ ') + ' │';
        const sep = (a, b, c) => a + L.map(x => '─'.repeat(x[1] + 2)).join(b) + c;
        tabla.textContent = [sep('┌', '┬', '┐'), fila(L.map(x => x[0])), sep('├', '┼', '┤'), ...inst.map(x => fila([x.id, 'mi-api', modo === 3 ? 'cluster' : 'fork', x.st === 'online' || x.st === 'launching' ? x.pid : 0, x.st === 'online' ? up(x) : '0', x.rs, x.st, x.st === 'online' ? (x.busy > t ? '100%' : Math.round(2 + rate / inst.length) + '%') : '0%'])), sep('└', '┴', '┘')].join('\n');
        tabla.hidden = false;
      } else tabla.hidden = true;
    }
    every(100, tick);
    arranca();
  }
});

    const cT = cols(card); const pT = pane(cT, 'Terminal', { dark: true, fn: 'docker build -t mi-api .' }); const term = terminal(pT.body, { max: 30, placeholder: '$ docker build -t mi-api .' }); term.el.style.maxHeight = '360px';

    const cR = cols(card); const pR = pane(cR, 'Desde tu máquina', { dark: true, fn: 'curl' }); const tR = terminal(pR.body, { max: 8 }); tR.el.style.minHeight = '80px';
    const m = msgRow(card);
    function pasos() {

      const cp = ['COPY package*.json ./', 'cp', 'deps' + depsV], all = ['COPY . .', 'all', `code${codeV}|deps${depsV}|ig${ignore}`], ins = ['RUN npm install --production', 'ins', ''];
      if (ingenuo) P.push(all, ins); else P.push(cp, ins, all);

    }
    function pintaDf(hl) {
      const P = pasos(); const L = [];
      const blancos = ingenuo ? [0, 1, 3] : [0, 1, 3, 4];

    }
    function pintaCont() {

      const tam = 135 + (ignore ? 24 : 187 + 31);
      cont.innerHTML = `<div class="dk-base">node:20-alpine <span>≈ 135 MB</span></div>${F.map(f => `<div class="dk-f ${f[2] || ''}"><code>${esc(f[0])}</code><span>${esc(f[1])}</span></div>`).join('')}<div class="dk-tot">Tamaño de la imagen ≈ <b>${tam} MB</b></div>`;
    }

      term.clear(''); nb++;
      term.log('$ docker build -t mi-api .', 'dim');
      let cad = true, tot = 0; const out = [], hl = {};
      const tiempos = { from: prev ? 0 : 6.2, wd: 0.1, cp: 0.1, ins: 18.4 + (depsV - 1) * 0.9, all: ignore ? 0.3 : 4.8 };
      P.forEach((p, i) => {

      term.log(` => [internal] load build context                                 ${tctx.toFixed(1)}s`, 'dim');
      term.log(` => => transferring context: ${ctx}`, ignore ? 'dim' : 'warn');
      out.forEach(([i, p, hit, tt]) => { const txt = i === 0 ? 'FROM docker.io/library/node:20-alpine@sha256:2c6c59cf…' : p[0]; const c = hit && i > 0; term.log(` => ${c ? '<span class="t-ok">CACHED</span> ' : ''}[${i + 1}/${P.length}] ${esc(txt)}${' '.repeat(Math.max(1, 44 - txt.length - (c ? 7 : 0)))}${tt.toFixed(1)}s`, hit ? '' : p[1] === 'ins' ? 'warn' : ''); });
      term.log(' => exporting to image                                            0.2s', 'dim');
      term.log(' => => naming to docker.io/library/mi-api                         0.0s', 'dim');
      pintaDf(hl);
      const insHit = out.find(o => o[1][1] === 'ins')[2], primero = !prev;
      prev = keys;
      let msg, kind = 'info';
      if (primero) msg = `Primer build: se ejecutan <b>todos</b> los pasos (${tot.toFixed(0)} s), y cada uno deja una <b>capa</b> guardada en caché. Vuelve a construir sin cambiar nada.`;
      else if (que === 'Sin cambios') { msg = 'Nada ha cambiado: <b>todas</b> las capas salen de la caché (<code>CACHED</code>) y el build es casi instantáneo. En el constructor clásico verías <code>---&gt; Using cache</code>.'; kind = 'good'; }
      else if (insHit) { msg = `${esc(que)}: la caché se aprovecha hasta <code>npm install</code> incluido, y solo se repite <code>COPY . .</code> (${tot.toFixed(1)} s en vez de ${(tot + 18.4).toFixed(0)}).`; kind = 'good'; }
      else if (ingenuo && tipo === 'code') { msg = `${esc(que)}… y se reinstalan <b>todas</b> las dependencias: <code>COPY . .</code> va antes de <code>npm install</code>, así que cualquier cambio en el código invalida esa capa <b>y todas las siguientes</b>. Por eso primero se copian solo <code>package*.json</code>.`; kind = 'bad'; }
      else msg = `${esc(que)}: cambia <code>package.json</code>, así que desde <code>COPY package*.json</code> hay que rehacerlo todo. Es lo esperable: las dependencias han cambiado de verdad.`;
      if (!ignore) { msg += ' Además, sin <code>.dockerignore</code> se envían 218 MB de contexto y la imagen se lleva tu <code>node_modules</code>, tu <code>.git</code> y tu <code>.env</code> <b>con los secretos dentro</b>.'; kind = 'bad'; }
      m(msg, kind);

    function ejecuta() {

      [3000, 8080].forEach(p => {

      });

  }

/* ============================================================
   Navegación por hash (#inicio, #s-1.4, #f-ficha, #lab-id, ...)
   ============================================================ */
const NAV = { tab: null, userTab: null, abiertos: {}, filtro: '', kbIdx: -1 };
let VISTA = { v: 'inicio', id: null };

function ruta() {
  const hs = decodeURIComponent((location.hash || '').slice(1));
  if (!hs || hs === 'inicio') return { v: 'inicio' };
  if (hs.startsWith('s-')) return { v: 'sesion', id: hs.slice(2) };
  if (hs.startsWith('f-')) return { v: 'ficha', id: hs.slice(2) };
  if (hs.startsWith('lab-')) return { v: 'lab', id: hs.slice(4) };
  if (hs === 'laboratorio') return { v: 'labs' };
  if (hs === 'referencia') return { v: 'ref' };
  if (hs === 'verificador') return { v: 'verif' };
  if (hs === 'progreso') return { v: 'progreso' };
  return { v: 'inicio' };
}
function ir(hash) { if (location.hash === '#' + hash) render(); else location.hash = hash; }

function render() {
  limpiaVista();
  hidePop();
  VISTA = ruta();
  const v = VISTA;
  let html = '';
  if (v.v === 'sesion' && APP.porId[v.id]) html = vistaSesion(v.id);
  else if (v.v === 'ficha' && APP.refId[v.id]) html = vistaFicha(v.id);
  else if (v.v === 'lab' && LABS[v.id]) html = vistaLab(v.id);
  else if (v.v === 'labs') html = vistaLabs();
  else if (v.v === 'ref') html = vistaRef();
  else if (v.v === 'verif') html = vistaVerif();
  else if (v.v === 'progreso') html = vistaProgreso();
  else { VISTA = { v: 'inicio' }; html = vistaInicio(); }
  const view = $('#view');
  view.innerHTML = `<div class="view">${html}</div>`;
  montaLabs(view);
  postRender();
  window.scrollTo(0, 0);
  if (VISTA.v === 'sesion') ui.set('ultima', VISTA.id);
  if (VISTA.v === 'lab') { const vis = ui.get('labsVistos', []); if (!vis.includes(VISTA.id)) { vis.push(VISTA.id); ui.set('labsVistos', vis); } }

function snippet(texto, q) {

}
function marca(txt, q) {

/* ============================================================

let spyObs = null;
function postRender() {
  if (spyObs) { spyObs.disconnect(); spyObs = null; }
  const toc = $('.toc');
  if (toc) {
    const links = $$('a[data-salta]', toc);
    const targets = links.map(a => document.getElementById(a.dataset.salta)).filter(Boolean);
    const vis = new Map();
    spyObs = new IntersectionObserver(es => {
      es.forEach(e => vis.set(e.target.id, e.isIntersecting ? e.boundingClientRect.top : null));
      let best = null;
      for (const t of targets) { const r = t.getBoundingClientRect(); if (r.top < window.innerHeight * .35) best = t.id; }
      if (!best && targets[0]) best = targets[0].id;
      links.forEach(a => a.classList.toggle('on', a.dataset.salta === best));
    }, { rootMargin: '0px 0px -60% 0px' });
    targets.forEach(t => spyObs.observe(t));
  }
  const hero = $('[data-hero]');
  if (hero) heroTree(hero);
  const b = $('#busca');
  if (b) b.addEventListener('input', () => { filtroRef = b.value; $('#refList').innerHTML = listaRef(); });
  const n = $('#nombre');
  if (n) n.addEventListener('change', () => { APP.estado.alumno = n.value; guarda(); tosta('Guardado.'); });
  const se = $('#selEj');
  if (se) se.addEventListener('change', () => { VERIF.ej = se.value; VERIF.res = null; render(); });
  const tco = $('#txCod');
  if (tco) tco.addEventListener('input', () => { VERIF.codigo = tco.value; });
  const z = $('#zona');
  if (z) {
    z.addEventListener('dragover', ev => { ev.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', async ev => {
      ev.preventDefault(); z.classList.remove('over');
      for (const f of ev.dataTransfer.files) {
        const t = await f.text();
        VERIF.codigo = t;
      }
      render(); tosta('Archivo cargado.');
    });
  }
  lectura();
}
function lectura() {
  const d = document.documentElement; const max = d.scrollHeight - window.innerHeight;
  $('#readBar').style.width = (max > 40 ? clamp(window.scrollY / max, 0, 1) * 100 : 0) + '%';
}

/* Animación de la portada: una petición atraviesa los nueve bloques y vuelve la respuesta */
function heroTree(host) {
  const ST = [['B0', 'Node'], ['B1', 'Express'], ['B2', 'Middleware'], ['B3', 'SQL'], ['B4', 'NoSQL'], ['B5', 'JWT'], ['B6', 'Tests'], ['B7', 'Docker'], ['B8', 'Full-stack']];
  const IDA = 5.6, VUELTA = 2.2, PAUSA = 1.4, CICLO = IDA + VUELTA + PAUSA;
  let t = 0, sel = -1;
  const pill = (ctx, x, y, txt, col) => { ctx.font = '700 11px "JetBrains Mono",monospace'; const w = ctx.measureText(txt).width + 16; rrect(ctx, x - w / 2, y - 10, w, 20, 10); ctx.fillStyle = col; ctx.fill(); ctext(ctx, txt, x, y + .5, { size: 11, col: '#07130D', align: 'center', mono: true, weight: 700 }); };
  const S = stage(host, {
    aspect: .62, min: 240, max: 380,
    draw(ctx, w, hh, dt) {
      ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, w, hh);
      ctx.fillStyle = '#16231C';
      for (let x = 12; x < w; x += 22) for (let y = 12; y < hh; y += 22) { ctx.beginPath(); ctx.arc(x, y, .9, 0, TAU); ctx.fill(); }
      t = REDUCED ? IDA * .999 : (t + dt) % CICLO;
      const n = ST.length, x0 = Math.max(34, w * .07), x1 = w - x0, yA = hh * .44, yB = hh * .64;
      const X = i => x0 + (x1 - x0) * i / (n - 1);
      const ida = t < IDA ? t / IDA : 1, vuelta = t >= IDA ? Math.min(1, (t - IDA) / VUELTA) : 0;
      const seg = ida * (n - 1), k = Math.min(n - 2, Math.floor(seg)), f = seg - k, sm = f < .45 ? 0 : (f - .45) / .55, xe = sm * sm * (3 - 2 * sm);
      ctx.lineWidth = 3; ctx.strokeStyle = hexA(COL.acc, .28); ctx.beginPath(); ctx.moveTo(X(0), yA); ctx.lineTo(X(n - 1), yA); ctx.stroke();
      ctx.strokeStyle = hexA(COL.hot, .25); ctx.beginPath(); ctx.moveTo(X(n - 1), yB); ctx.lineTo(X(0), yB); ctx.stroke();
      ctx.strokeStyle = COL.acc; ctx.beginPath(); ctx.moveTo(X(0), yA); ctx.lineTo(t < IDA ? lerp(X(k), X(k + 1), xe) : X(n - 1), yA); ctx.stroke();
      if (t >= IDA) { ctx.strokeStyle = COL.hot; ctx.beginPath(); ctx.moveTo(X(n - 1), yB); ctx.lineTo(lerp(X(n - 1), X(0), easeOut(vuelta)), yB); ctx.stroke(); }
      for (let i = 0; i < n; i++) {
        const x = X(i), pasada = t >= IDA || i <= k + (xe > .98 ? 1 : 0), hov = S.ptr.over && Math.hypot(S.ptr.x - x, S.ptr.y - yA) < 16;
        glowDot(ctx, x, yA, hov || sel === i ? 11 : 9, pasada ? COL.acc : COL.line2);
        ctext(ctx, ST[i][0], x, yA + 1, { size: 9.5, col: pasada ? '#07130D' : COL.muted, align: 'center', weight: 700, mono: true });
        ctx.strokeStyle = hexA(COL.muted, .35); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, yA + 10); ctx.lineTo(x, yB); ctx.stroke();
        ctext(ctx, ST[i][1], x, yB + 22 + (i % 2) * 16, { size: Math.min(12, w / 44), col: hov || sel === i ? COL.ink : COL.muted, align: 'center' });
      }
      if (t < IDA) pill(ctx, lerp(X(k), X(k + 1), xe), yA - 24, 'GET /api/tareas', COL.acc);
      else if (vuelta < 1) pill(ctx, lerp(X(n - 1), X(0), easeOut(vuelta)), yB, '200 OK · JSON', COL.hot);
      else pill(ctx, X(0), yB, '200 OK · JSON', COL.hot);
      ctext(ctx, '$ node servidor.js', 16, 20, { size: 11.5, col: COL.dim, mono: true });
      ctext(ctx, 'Servidor escuchando en http://localhost:3000', 16, 38, { size: 11, col: COL.muted, mono: true });
    }
  });
  S.onDown = (px, py) => { const n = ST.length, m = Math.max(34, S.w * .07); for (let i = 0; i < n; i++) { const x = m + (S.w - 2 * m) * i / (n - 1); if (Math.hypot(px - x, py - S.h * .44) < 18) { const s0 = APP.sesiones.find(s => s.bloque === String(i)); if (s0) location.hash = 's-' + s0.id; } } };
}

function cierraMenu() { $('#side').classList.remove('open'); $('#scrim').hidden = true; $('#menuBtn').setAttribute('aria-expanded', 'false'); }
function abreMenu() { $('#side').classList.add('open'); $('#scrim').hidden = false; $('#menuBtn').setAttribute('aria-expanded', 'true'); }

document.addEventListener('click', ev => {
  const cp = ev.target.closest('[data-copy]');
  if (cp) { copiaTexto(CODE_SRC[cp.dataset.copy] || '', 'Código copiado.').then(ok => { if (ok) { const s = $('span', cp); if (s) { s.textContent = 'Copiado'; setTimeout(() => { s.textContent = 'Copiar'; }, 1400); } } }); return; }
  const salta = ev.target.closest('[data-salta]');
  if (salta) {
    ev.preventDefault();
    const d = document.getElementById(salta.dataset.salta);
    if (d) { d.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); d.setAttribute('tabindex', '-1'); d.focus({ preventScroll: true }); }
    return;
  }
  const pl = ev.target.closest('[data-plegar]');
  if (pl) {
    const k = pl.dataset.plegar;
    const actual = NAV.abiertos[k] !== undefined ? NAV.abiertos[k] : pl.dataset.def === 'true';
    NAV.abiertos[k] = !actual; pintaNav(); return;
  }
  const el = ev.target.closest('[data-acc]');
  if (!el) return;
  const acc = el.dataset.acc, k = el.dataset.k;
  if (acc === 'hecho') {
    marcaEj(k, 'h', !hechoEj(k));
    const art = el.closest('.ej'); const y = art ? art.getBoundingClientRect().top : 0;
    const { s, e } = localiza(k);
    const tmp = document.createElement('div'); tmp.innerHTML = ejercicio(s, e, 'ABCD'.indexOf(k.split(':')[1]));
    const zonaVieja = art.querySelector('[data-zona]'); const nuevo = tmp.firstElementChild;
    nuevo.querySelector('[data-zona]').replaceWith(zonaVieja);
    art.replaceWith(nuevo);
    window.scrollBy(0, nuevo.getBoundingClientRect().top - y);
    if (hechoEj(k)) { flash(nuevo, 'pulse-acc'); tosta('¡Ejercicio marcado como hecho!'); }
    pintaNav(); return;
  }
  if (acc === 'pista') {
    const { e } = localiza(k); const zona = $(`[data-zona="${k}"]`);
    const n = +(zona.dataset.pistas || 0);
    if (n >= e.pistas.length) { tosta('No hay más pistas para este ejercicio.'); return; }
    zona.dataset.pistas = n + 1;
    const d = h('div', { class: 'ej-x pista' });
    d.innerHTML = `<div class="xl">${icon('bulb', '')}Pista ${n + 1} de ${e.pistas.length}</div><div class="prose">${md(e.pistas[n])}</div>`;
    d.querySelector('svg').style.cssText = 'width:15px;height:15px';
    zona.appendChild(d); return;
  }
  if (acc === 'verif') { VERIF.ej = k; VERIF.res = null; ir('verificador'); return; }
  if (acc === 'sol') {
    const { e } = localiza(k); const zona = $(`[data-zona="${k}"]`);
    if (solVista(k) || zona.dataset.conf === '1') { muestraSol(zona, e, k); return; }
    zona.dataset.conf = '1';
    const d = h('div', { class: 'ej-x gate' });
    d.innerHTML = `<div class="xl">Antes de mirar: ¿lo has intentado de verdad?</div><p style="margin:0 0 10px">Equivocarse y corregir fija mucho más que leer la respuesta correcta. Si abres la solución sin haber peleado un rato, el ejercicio no te va a servir de nada.</p><div class="row"><button class="btn sm" data-acc="sol" data-k="${k}">Lo he intentado, enséñamela</button><button class="btn ghost sm" data-acc="cancela" data-k="${k}">Sigo intentándolo</button></div>`;
    zona.appendChild(d); return;
  }
  if (acc === 'cancela') { const zona = $(`[data-zona="${k}"]`); zona.dataset.conf = ''; $$('.gate', zona).forEach(x => x.remove()); return; }
  if (acc === 'resp') {
    const { q } = localizaPreg(k);
    if (!q || APP.estado.q[k]) return;
    const op = +el.dataset.op;
    APP.estado.q[k] = { ok: op === q.buena, op }; guarda();
    const box = el.closest('.q'); const n = +($('.qn', box).textContent);
    const tmp = document.createElement('div'); tmp.innerHTML = pregunta(q, k, n);
    box.replaceWith(tmp.firstElementChild);
    return;
  }
  if (acc === 'correr') { correVerif(); return; }
  if (acc === 'limpiar') { VERIF.codigo = ''; VERIF.res = null; render(); return; }
  if (acc === 'exportar') { exporta(); return; }
  if (acc === 'copiar') { copiaTexto(datosExport(), 'Progreso copiado. Pégalo donde quieras guardarlo.'); return; }
  if (acc === 'importar') { importa(); return; }
  if (acc === 'pegar') {
    const zona = $('[data-zona="borrado"]');
    zona.innerHTML = `<div class="confirm"><label class="field" style="margin:0"><span>Pega aquí tu copia</span><textarea id="pegado" style="min-height:120px" spellcheck="false"></textarea></label><div class="row" style="margin-top:10px"><button class="btn sm" data-acc="pegar2">Importar</button><button class="btn ghost sm" data-acc="borrarno">Cancelar</button></div></div>`;
    $('#pegado').focus(); return;
  }
  if (acc === 'pegar2') { importaTexto($('#pegado').value); return; }
  if (acc === 'borrar') {
    $('[data-zona="borrado"]').innerHTML = `<div class="confirm"><p style="margin:0 0 4px;font-weight:700;color:var(--warn)">Esto borra todo tu progreso y no se puede deshacer.</p><p style="margin:0 0 10px">Exporta antes si quieres conservarlo.</p><div class="row"><button class="btn sm" data-acc="borrar2" style="background:var(--bad);color:#fff">Sí, bórralo todo</button><button class="btn ghost sm" data-acc="borrarno">Mejor no</button></div></div>`;
    return;
  }
  if (acc === 'borrarno') { $('[data-zona="borrado"]').innerHTML = ''; return; }
  if (acc === 'borrar2') { APP.estado = molde(); guarda(); render(); tosta('Progreso borrado.'); return; }
});
function muestraSol(zona, e, k) {
  if (zona.dataset.sol === '1') return;
  zona.dataset.sol = '1';
  $$('.gate', zona).forEach(x => x.remove());
  marcaEj(k, 'sol', true);
  const d = h('div', { class: 'ej-x sol' });
  d.innerHTML = `<div class="xl">Solución</div><div class="prose">${md(e.solucion)}</div>`;
  zona.appendChild(d);
  const b = $(`[data-acc="sol"][data-k="${k}"]`); if (b) b.innerHTML = icon('key') + 'Ver solución';
}

/* Vista previa de fichas al pasar el ratón por un enlace § */
let popEl = null, popT = null;
function hidePop() { clearTimeout(popT); if (popEl) { popEl.remove(); popEl = null; } }
function resumenFicha(c) {
  const t = c.cuerpo.replace(/```[\s\S]*?```/g, ' ').replace(/^:::.*$/gm, ' ').replace(/^##.*$/gm, ' ').replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, id, x) => x || (APP.refId[id] ? APP.refId[id].titulo : id)).replace(/[*`>|]/g, '').replace(/\s+/g, ' ').trim();
  return t.length > 190 ? t.slice(0, 190).replace(/\s\S*$/, '') + '…' : t;
}
if (window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches) {
  document.addEventListener('mouseover', ev => {
    const a = ev.target.closest('[data-ref]');
    if (!a) { if (popEl && !ev.target.closest('.pop')) hidePop(); return; }
    const c = APP.refId[a.dataset.ref]; if (!c) return;
    clearTimeout(popT);
    popT = setTimeout(() => {
      hidePop();
      popEl = h('div', { class: 'pop', role: 'tooltip', html: `<span class="k">Referencia · ${esc(c.tema)}</span><b>${esc(c.titulo)}</b>${esc(resumenFicha(c))}` });
      document.body.appendChild(popEl);
      const r = a.getBoundingClientRect(); const pw = popEl.offsetWidth, ph = popEl.offsetHeight;
      let x = clamp(r.left, 10, window.innerWidth - pw - 10); let y = r.bottom + 8;
      if (y + ph > window.innerHeight - 10) y = r.top - ph - 8;
      popEl.style.left = x + 'px'; popEl.style.top = y + 'px';
    }, 380);
  });
  document.addEventListener('mouseout', ev => { if (ev.target.closest('[data-ref]')) { clearTimeout(popT); setTimeout(() => { if (popEl && !document.querySelector('[data-ref]:hover')) hidePop(); }, 60); } });
}

/* Buscador lateral */
const qInput = $('#q');
qInput.addEventListener('input', () => { NAV.filtro = qInput.value; NAV.kbIdx = -1; pintaNav(); });
qInput.addEventListener('keydown', ev => {
  const items = $$('.srch a', $('#nav'));
  if (ev.key === 'Escape') { qInput.value = ''; NAV.filtro = ''; pintaNav(); qInput.blur(); return; }
  if (!items.length) return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    NAV.kbIdx = clamp(NAV.kbIdx + (ev.key === 'ArrowDown' ? 1 : -1), 0, items.length - 1);
    items.forEach((a, i) => a.classList.toggle('kb', i === NAV.kbIdx));
    items[NAV.kbIdx].scrollIntoView({ block: 'nearest' });
  }
  if (ev.key === 'Enter') { const a = items[Math.max(0, NAV.kbIdx)]; if (a) { location.hash = a.getAttribute('href').slice(1); qInput.value = ''; NAV.filtro = ''; qInput.blur(); } }
});
$('#nav').addEventListener('click', ev => { if (ev.target.closest('.srch a')) { qInput.value = ''; NAV.filtro = ''; setTimeout(pintaNav, 0); } });
$('#tabSes').addEventListener('click', () => { NAV.userTab = 'ses'; pintaNav(); });
$('#tabRef').addEventListener('click', () => { NAV.userTab = 'ref'; pintaNav(); });
$('#menuBtn').addEventListener('click', () => { $('#side').classList.contains('open') ? cierraMenu() : abreMenu(); });
$('#scrim').addEventListener('click', cierraMenu);

/* Tema: sistema → claro → oscuro */
const TEMAS = ['auto', 'light', 'dark'];
function aplicaTema(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  const lbl = { auto: 'Tema del sistema', light: 'Tema claro', dark: 'Tema oscuro' }[t];
  $('#themeBtn').innerHTML = icon(t === 'auto' ? 'auto' : t === 'light' ? 'sun' : 'moon') + '<span>' + { auto: 'Sistema', light: 'Claro', dark: 'Oscuro' }[t] + '</span>';
  $('#themeBtn').setAttribute('aria-label', lbl + '. Pulsa para cambiar');
}
let temaAct = ui.get('tema', 'auto'); if (!TEMAS.includes(temaAct)) temaAct = 'auto';
aplicaTema(temaAct);
$('#themeBtn').addEventListener('click', () => { temaAct = TEMAS[(TEMAS.indexOf(temaAct) + 1) % 3]; ui.set('tema', temaAct); aplicaTema(temaAct); });

/* Teclado */
document.addEventListener('keydown', ev => {
  const tag = (ev.target.tagName || '').toLowerCase();
  const escribiendo = ['input', 'textarea', 'select'].includes(tag) || ev.target.isContentEditable;
  if (ev.key === 'Escape') { cierraMenu(); hidePop(); }
  if (escribiendo || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === '/') { ev.preventDefault(); if (window.innerWidth <= 980) abreMenu(); qInput.focus(); return; }
  if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
    const pg = $('.pager'); if (!pg) return;
    const a = ev.key === 'ArrowLeft' ? $('a:not(.nx)', pg) : $('a.nx', pg);
    if (a) { location.hash = a.getAttribute('href').slice(1); }
  }
});
window.addEventListener('scroll', () => { lectura(); if (popEl) hidePop(); }, { passive: true });
window.addEventListener('hashchange', render);

(async function () {
  let crudoSes, crudoCon;
  try { crudoSes = await inflaBase64(DATOS_Z.s); crudoCon = await inflaBase64(DATOS_Z.c); }
  catch (e) {
    $('#view').innerHTML = '<h1>No se ha podido abrir el curso</h1><p>Este navegador no puede descomprimir el contenido. Prueba con una versión reciente de Chrome, Firefox o Safari.</p>';
    return;
  }
  APP.sesiones = parseaSesiones(crudoSes);
  APP.conceptos = parseaConceptosPlano(crudoCon);
  APP.sesiones.forEach(s => APP.porId[s.id] = s);
  APP.conceptos.forEach(c => APP.refId[c.id] = c);
  await carga();
  render();
})();

</script>
